name: Build & Test

on:
  push:
    branches: [master, main, phase-2]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]

env:
  QT_VERSION: "6.5.3"
  QT_ARCH: "win64_msvc2019_64"
  NODE_VERSION: "20"

jobs:
  build-backend:
    name: Backend (Qt/MSBuild)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.*

      - name: Install Qt + modules
        run: |
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
            -m qtwebsockets qtwebengine qtwebchannel qtpositioning `
            --autodesktop `
            --outputdir D:\a\KatHub\Qt

      - name: Set Qt path
        run: |
          # aqt uses arch suffix without "win64_" prefix in output dir
          $arch_short = ($env:QT_ARCH -replace '^win64_', '')
          $qt_root = "D:\a\KatHub\Qt\$env:QT_VERSION\$arch_short"
          echo "QT_ROOT=$qt_root" >> $env:GITHUB_ENV
          Write-Host "Qt root: $qt_root"
          if (-not (Test-Path "$qt_root\lib\cmake\Qt6\Qt6Config.cmake")) {
            Write-Host "ERROR: Qt6Config.cmake not found!"
            Get-ChildItem D:\a\KatHub\Qt -Recurse -Directory -Depth 2 | Select-Object FullName | Select-Object -First 15
            exit 1
          }

      - name: CMake Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DCMAKE_BUILD_TYPE=Release

      - name: MSBuild
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild `
            -find MSBuild\Current\Bin\MSBuild.exe
          & $msbuild build/kathub-backend.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /m /v:minimal /t:Build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: build/Release/kathub-backend.exe

  build-frontend:
    name: Frontend (Vue/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
