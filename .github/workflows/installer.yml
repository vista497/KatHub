name: Installer

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  QT_VERSION: "6.5.3"
  QT_ARCH_AQT: "win64_msvc2019_64"
  QT_ARCH_DIR: "msvc2019_64"
  NODE_VERSION: "20"

jobs:
  build-backend:
    name: Backend
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.*

      - name: Install Qt
        run: |
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH_AQT `
            -m qtwebsockets qtwebengine qtwebchannel qtpositioning `
            --autodesktop `
            --noarchives `
            --outputdir D:\a\KatHub\Qt

      - name: CMake Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="D:\a\KatHub\Qt\$env:QT_VERSION\$env:QT_ARCH_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: build/backend/Release/kathub-backend.exe

  build-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npx vite build

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  package-installer:
    name: Inno Setup Package
    needs: [build-backend, build-frontend]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.*

      - name: Install Qt (for windeployqt)
        run: |
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH_AQT `
            -m qtwebsockets qtwebengine qtwebchannel qtpositioning `
            --outputdir D:\a\KatHub\Qt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: art/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: art/static/

      - name: Prepare staging (copy artifacts)
        run: |
          $staging = "installer/staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy backend binary
          Copy-Item "art/kathub-backend.exe" "$staging/kathub-backend.exe"
          Write-Host "Backend copied to staging"

          # Copy frontend
          if (Test-Path art/static/index.html) {
            Copy-Item -Recurse "art/static/*" "$staging/static/"
            Write-Host "Frontend copied to staging/static"
          }

      - name: Run windeployqt + package
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $qt_bin = "D:\a\KatHub\Qt\$env:QT_VERSION\$env:QT_ARCH_DIR\bin"

          # windeployqt directly on the staging binary
          & "$qt_bin/windeployqt.exe" installer/staging/kathub-backend.exe `
            --no-translations --no-compiler-runtime
          Write-Host "windeployqt done"

          # Copy MSVC DLLs from System32
          $dlls = @(
            "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll",
            "vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll",
            "vccorlib140.dll", "concrt140.dll"
          )
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src "installer/staging/$dll"
              Write-Host "Copied $dll"
            } else {
              Write-Host "WARNING: $dll not found"
            }
          }

          # Copy prompt templates if they exist
          $tpl = "backend/prompts/templates"
          if (Test-Path $tpl) {
            Copy-Item -Recurse $tpl "installer/staging/templates/"
            Write-Host "Templates copied"
          }

      - name: Build installer (ISCC)
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "ISCC: $iscc"
          & $iscc installer/kathub.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KatHub-Setup
          path: installer/publish/KatHub_Setup_*.exe

  github-release:
    name: Release
    needs: package-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: KatHub-Setup
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/KatHub_Setup_*.exe
          generate_release_notes: true
