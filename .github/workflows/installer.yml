name: Installer

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  QT_VERSION: "6.5.3"
  QT_ARCH_AQT: "win64_msvc2019_64"
  QT_ARCH_DIR: "msvc2019_64"
  NODE_VERSION: "20"

jobs:
  build-backend:
    name: Backend
    runs-on: windows-2022
    outputs:
      qt-root: ${{ steps.qt-root.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.*

      - name: Install Qt
        run: |
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH_AQT `
            --autodesktop `
            -m qtwebsockets qtwebengine qtwebchannel qtpositioning `
            --outputdir D:\a\KatHub\Qt

      - name: Set Qt root
        id: qt-root
        run: |
          $p = "D:\a\KatHub\Qt\$env:QT_VERSION\$env:QT_ARCH_DIR"
          echo "path=$p" >> $env:GITHUB_OUTPUT

      - name: CMake Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="D:\a\KatHub\Qt\$env:QT_VERSION\$env:QT_ARCH_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: build/backend/Release/kathub-backend.exe

  build-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npx vite build

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  package-installer:
    name: Inno Setup Package
    needs: [build-backend, build-frontend]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: pip install aqtinstall==3.3.*

      - name: Install Qt (for windeployqt)
        run: |
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH_AQT `
            --autodesktop `
            -m qtwebsockets qtwebengine qtwebchannel qtpositioning `
            --outputdir D:\a\KatHub\Qt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: staging/

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: staging/static/

      - name: Build staging (windeployqt + MSVC DLLs)
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $qt_bin = "D:\a\KatHub\Qt\$env:QT_VERSION\$env:QT_ARCH_DIR\bin"
          python installer/package_staging.py `
            --build-dir build `
            --qt-bin-dir "$qt_bin" `
            --release

      - name: Build installer (ISCC)
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc installer/kathub.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KatHub-Setup
          path: installer/publish/KatHub_Setup_*.exe

  github-release:
    name: Release
    needs: package-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: KatHub-Setup
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/KatHub_Setup_*.exe
          generate_release_notes: true
