<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KatHub — Backend Test Dashboard</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d2991d;
    --radius: 6px;
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.6;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header .badge {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 10px;
    color: var(--text-secondary);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    font-weight: 600;
  }

  .card-header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    transition: background 0.3s ease;
  }

  .dot-green  { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot-red    { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .dot-amber  { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
  .dot-gray   { background: var(--text-muted); }

  .card-body {
    padding: 14px 16px;
    font-size: 0.82rem;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    color: var(--text-secondary);
  }

  .card-body.error {
    color: var(--danger);
  }

  .card-body.success {
    color: var(--success);
  }

  .log-panel {
    grid-column: 1 / -1;
  }

  .log-panel .card-body {
    max-height: 340px;
  }

  .log-entry {
    padding: 3px 0;
    border-bottom: 1px solid rgba(48, 54, 61, 0.5);
  }

  .log-entry:last-child {
    border-bottom: none;
  }

  .log-entry .ts {
    color: var(--text-muted);
    margin-right: 10px;
  }

  .log-entry.error-entry {
    color: var(--danger);
  }

  .log-entry.info-entry {
    color: var(--text-secondary);
  }

  .log-entry.success-entry {
    color: var(--success);
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  button {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  button:hover {
    background: #30363d;
    border-color: var(--text-muted);
  }

  button.accent {
    background: #1f6feb;
    border-color: #1f6feb;
    color: #fff;
  }

  button.accent:hover {
    background: #388bfd;
  }

  button.danger {
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
  }

  button.danger:hover {
    background: rgba(248, 81, 73, 0.1);
  }

  .status-bar {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .status-bar span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .plugin-item {
    padding: 6px 0;
    border-bottom: 1px solid rgba(48, 54, 61, 0.4);
  }

  .plugin-item:last-child {
    border-bottom: none;
  }

  .plugin-name {
    color: var(--text-primary);
    font-weight: 600;
  }

  .plugin-meta {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: 2px;
  }

  .empty-state {
    color: var(--text-muted);
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>KatHub</h1>
  <span class="badge">Backend Test Dashboard</span>
</header>

<div class="status-bar">
  <span>Auto-refresh: <strong id="refresh-indicator">ON</strong></span>
  <span>Last ping: <strong id="last-ping">—</strong></span>
  <span>Base URL: <strong id="base-url-display">http://localhost:8080</strong></span>
</div>

<div class="controls">
  <button class="accent" onclick="refreshAll()" title="Fetch all endpoints now">Refresh All</button>
  <button onclick="fetchStatus()" title="Ping /api/status">Ping Status</button>
  <button onclick="fetchPlugins()" title="Ping /api/plugins">Ping Plugins</button>
  <button id="toggle-auto" onclick="toggleAutoRefresh()">Stop Auto-Refresh</button>
  <button onclick="clearLog()" class="danger">Clear Log</button>
</div>

<div class="grid">
  <!-- Server Status Card -->
  <div class="card">
    <div class="card-header">
      <span>Server Status — /api/status</span>
      <span class="dot dot-gray" id="status-dot" title="Not yet checked"></span>
    </div>
    <div class="card-body" id="status-body">
      <span class="empty-state">Waiting for first ping...</span>
    </div>
  </div>

  <!-- Plugin List Card -->
  <div class="card">
    <div class="card-header">
      <span>Loaded Plugins — /api/plugins</span>
      <span class="dot dot-gray" id="plugins-dot" title="Not yet checked"></span>
    </div>
    <div class="card-body" id="plugins-body">
      <span class="empty-state">Waiting for first ping...</span>
    </div>
  </div>

  <!-- Log Panel -->
  <div class="card log-panel">
    <div class="card-header">
      <span>Event Log</span>
      <span id="log-count">0 entries</span>
    </div>
    <div class="card-body" id="log-body">
      <span class="empty-state">No events logged yet.</span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Configuration ----
  const BASE_URL = (() => {
    // Allow override via ?base=http://host:port
    const params = new URLSearchParams(window.location.search);
    return params.get('base') || 'http://localhost:8080';
  })();

  const STATUS_ENDPOINT = BASE_URL + '/api/status';
  const PLUGINS_ENDPOINT = BASE_URL + '/api/plugins';
  const AUTO_REFRESH_MS = 5000;
  const MAX_LOG_ENTRIES = 200;

  // ---- State ----
  let autoRefreshTimer = null;
  let autoRefreshOn = true;
  let logEntries = [];

  // ---- DOM refs ----
  const $ = (sel) => document.querySelector(sel);

  const statusDot = $('#status-dot');
  const statusBody = $('#status-body');
  const pluginsDot = $('#plugins-dot');
  const pluginsBody = $('#plugins-body');
  const logBody = $('#log-body');
  const logCount = $('#log-count');
  const lastPing = $('#last-ping');
  const refreshIndicator = $('#refresh-indicator');
  const toggleBtn = $('#toggle-auto');
  const baseUrlDisplay = $('#base-url-display');

  // ---- Init ----
  baseUrlDisplay.textContent = BASE_URL;

  function setDot(el, state) {
    el.className = 'dot dot-' + state;
  }

  function timestamp() {
    const now = new Date();
    return now.toLocaleTimeString('en-GB', { hour12: false });
  }

  function addLog(message, level) {
    level = level || 'info';
    const entry = { ts: timestamp(), message: message, level: level };
    logEntries.push(entry);
    if (logEntries.length > MAX_LOG_ENTRIES) {
      logEntries.shift();
    }
    renderLog();
  }

  function renderLog() {
    logCount.textContent = logEntries.length + ' entries';
    if (logEntries.length === 0) {
      logBody.innerHTML = '<span class="empty-state">No events logged yet.</span>';
      return;
    }
    let html = '';
    for (let i = logEntries.length - 1; i >= 0; i--) {
      const e = logEntries[i];
      html += '<div class="log-entry ' + e.level + '-entry">';
      html += '<span class="ts">' + escapeHtml(e.ts) + '</span>';
      html += escapeHtml(e.message);
      html += '</div>';
    }
    logBody.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function formatJson(obj) {
    try {
      return JSON.stringify(obj, null, 2);
    } catch (e) {
      return String(obj);
    }
  }

  async function fetchWithTimeout(url, timeoutMs) {
    timeoutMs = timeoutMs || 8000;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, {
        signal: controller.signal,
        headers: { 'Accept': 'application/json' }
      });
      clearTimeout(timeout);
      return res;
    } catch (err) {
      clearTimeout(timeout);
      throw err;
    }
  }

  // ---- Status Fetch ----
  async function fetchStatus() {
    addLog('GET ' + STATUS_ENDPOINT + ' ...', 'info');
    statusBody.textContent = 'Fetching...';
    setDot(statusDot, 'gray');

    try {
      const res = await fetchWithTimeout(STATUS_ENDPOINT);
      const text = await res.text();

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        // Not JSON — show raw
        json = null;
      }

      if (res.ok) {
        setDot(statusDot, 'green');
        statusBody.className = 'card-body success';
        statusBody.textContent = json ? formatJson(json) : text;
        addLog('/api/status → ' + res.status + ' OK', 'success');
      } else {
        setDot(statusDot, 'amber');
        statusBody.className = 'card-body error';
        statusBody.textContent = 'HTTP ' + res.status + ' ' + res.statusText + '\n\n' + text;
        addLog('/api/status → ' + res.status + ' ' + res.statusText, 'error');
      }
    } catch (err) {
      setDot(statusDot, 'red');
      statusBody.className = 'card-body error';
      statusBody.textContent = 'Connection failed: ' + err.message;
      addLog('/api/status → FAIL: ' + err.message, 'error');
    }
  }

  // ---- Plugins Fetch ----
  async function fetchPlugins() {
    addLog('GET ' + PLUGINS_ENDPOINT + ' ...', 'info');
    pluginsBody.textContent = 'Fetching...';
    setDot(pluginsDot, 'gray');

    try {
      const res = await fetchWithTimeout(PLUGINS_ENDPOINT);
      const text = await res.text();

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        json = null;
      }

      if (res.ok) {
        setDot(pluginsDot, 'green');
        pluginsBody.className = 'card-body';

        if (json && Array.isArray(json.plugins)) {
          const plugins = json.plugins;
          let html = '';
          for (const p of plugins) {
            html += '<div class="plugin-item">';
            html += '<div class="plugin-name">' + escapeHtml(p.name || p.id || 'Unknown') + '</div>';
            html += '<div class="plugin-meta">';
            html += 'v' + escapeHtml(String(p.version || '—')) + ' &middot; ';
            html += escapeHtml(p.status || 'loaded');
            if (p.description) {
              html += ' &middot; ' + escapeHtml(p.description);
            }
            html += '</div>';
            html += '</div>';
          }
          pluginsBody.innerHTML = html || '<span class="empty-state">No plugins loaded.</span>';
        } else if (json) {
          pluginsBody.textContent = formatJson(json);
        } else {
          pluginsBody.textContent = text;
        }

        addLog('/api/plugins → ' + res.status + ' OK (' + (json && json.plugins ? json.plugins.length + ' plugins' : 'no array') + ')', 'success');
      } else {
        setDot(pluginsDot, 'amber');
        pluginsBody.className = 'card-body error';
        pluginsBody.textContent = 'HTTP ' + res.status + ' ' + res.statusText + '\n\n' + text;
        addLog('/api/plugins → ' + res.status + ' ' + res.statusText, 'error');
      }
    } catch (err) {
      setDot(pluginsDot, 'red');
      pluginsBody.className = 'card-body error';
      pluginsBody.textContent = 'Connection failed: ' + err.message;
      addLog('/api/plugins → FAIL: ' + err.message, 'error');
    }
  }

  // ---- Combined Refresh ----
  function refreshAll() {
    lastPing.textContent = 'fetching...';
    addLog('Manual refresh triggered', 'info');
    // Fire both in parallel
    Promise.allSettled([fetchStatus(), fetchPlugins()]).then(() => {
      lastPing.textContent = timestamp();
    });
  }

  // ---- Auto-Refresh ----
  function startAutoRefresh() {
    if (autoRefreshTimer) return;
    autoRefreshTimer = setInterval(() => {
      lastPing.textContent = 'auto...';
      Promise.allSettled([fetchStatus(), fetchPlugins()]).then(() => {
        lastPing.textContent = timestamp();
      });
    }, AUTO_REFRESH_MS);
    autoRefreshOn = true;
    refreshIndicator.textContent = 'ON';
    refreshIndicator.style.color = 'var(--success)';
    toggleBtn.textContent = 'Stop Auto-Refresh';
  }

  function stopAutoRefresh() {
    if (autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = null;
    }
    autoRefreshOn = false;
    refreshIndicator.textContent = 'OFF';
    refreshIndicator.style.color = 'var(--danger)';
    toggleBtn.textContent = 'Start Auto-Refresh';
  }

  function toggleAutoRefresh() {
    if (autoRefreshOn) {
      stopAutoRefresh();
      addLog('Auto-refresh stopped', 'info');
    } else {
      startAutoRefresh();
      addLog('Auto-refresh started (every ' + (AUTO_REFRESH_MS / 1000) + 's)', 'info');
    }
  }

  function clearLog() {
    logEntries = [];
    renderLog();
    addLog('Log cleared', 'info');
  }

  // ---- Expose to global scope for onclick handlers ----
  window.fetchStatus = fetchStatus;
  window.fetchPlugins = fetchPlugins;
  window.refreshAll = refreshAll;
  window.toggleAutoRefresh = toggleAutoRefresh;
  window.clearLog = clearLog;

  // ---- Startup ----
  addLog('KatHub Test Dashboard loaded. Base URL: ' + BASE_URL, 'info');
  refreshAll();
  startAutoRefresh();
})();
</script>

</body>
</html>
